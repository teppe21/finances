name: Android Release (Signed Bundle & APK)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version name (e.g., 2.0.0)'
        required: false
        default: '2.0.0'
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build Signed Release AAB & APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-native

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Decode Release Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release-keystore.jks

      - name: Build Signed Release AAB & APK
        env:
          FINANCES_KEYSTORE_PATH: /tmp/release-keystore.jks
          FINANCES_KEYSTORE_PASSWORD: ${{ secrets.FINANCES_KEYSTORE_PASSWORD }}
          FINANCES_KEY_ALIAS: ${{ secrets.FINANCES_KEY_ALIAS }}
          FINANCES_KEY_PASSWORD: ${{ secrets.FINANCES_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Clean Keystore File
        if: always()
        run: rm -f /tmp/release-keystore.jks

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android-native/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android-native/app/build/outputs/apk/release/app-release.apk
