name: Android CI & Release Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test Native Android
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-native

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release Bundle (AAB) & APK
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: android-native/app/build/reports/tests/

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android-native/app/build/outputs/bundle/release/app-release.aab
